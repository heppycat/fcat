[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
kotlinxCoroutines = "1.9.0"
mupdf = "1.28.5"
ndk = "30.0.16248370"
cmake = "4.1.2"
# A bblanchon/pdfium-binaries release tag (non-V8 Android builds). Bump the four SHA-256 digests with it:
# GitHub shows them per asset on the release page.
pdfium = "chromium/8125"
pdfiumSha256Arm = "ac4ac5319ded88ba5d885747a6b2641e7f712c9797de0770465104abe4dbf7da"
pdfiumSha256Arm64 = "0495e57163429937caaee1bdd9b07924a7098dbd51d1b97645d124e349f097b4"
pdfiumSha256X86 = "9d4f7edf5b46e1ab155d9da3e56520f2554900997c74e21951f524ea7928c622"
pdfiumSha256X64 = "bd68707f29f2316c20f9d5c793b8731796a4a65408ac4d3c30bc606390354e41"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
mupdf-fitz = { module = "com.artifex.mupdf:fitz", version.ref = "mupdf" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
