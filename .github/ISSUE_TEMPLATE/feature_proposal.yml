name: Feature proposal
description: Suggest an improvement or a new capability.
labels: ["proposal", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/PRODUCT.md (scope and non-goals) and docs/ROADMAP.md first.
        Proposals that conflict with the non-goals (network, accounts, ads, AI services, proprietary SDKs) will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do while reading, and what gets in the way? Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and other apps
      description: Workarounds you use today, or how other readers handle it.
  - type: textarea
    id: cost
    attributes:
      label: Impact on reading performance and simplicity
      description: Could this slow down opening, scrolling or zoom, or add UI clutter? How would we avoid that?
